# Endurance in Docker, if you'd rather not install Node.
#
#   cp .env.example .env     # add your Kite app keys and one AI key
#   docker compose up        # builds once, then open http://localhost:3000
#
# The app is published on 127.0.0.1 only, so other devices on your network can't
# reach it. Your Kite session, snapshots and chats live in the endurance-data volume.

services:
  endurance:
    build: .
    image: endurance:local
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - endurance-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  endurance-data:
