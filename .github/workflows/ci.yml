name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  kite-mcp:
    name: Kite MCP checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kite-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: kite-mcp/go.mod
          cache-dependency-path: kite-mcp/go.sum

      - name: Run tests
        run: go test ./...
