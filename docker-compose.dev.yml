# For local development with `npm run dev`: runs only Postgres and Redis and
# publishes them on 127.0.0.1 so the app on your machine can reach them.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
